<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🌈 My Weekly To-Do · 12 yr old</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', 'Quicksand', sans-serif; }
        body {
            background: linear-gradient(145deg, #ffe9f4 0%, #d9e6ff 100%);
            min-height: 100vh; padding: 12px 12px 30px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { font-size: 1.9rem; color: #4a2c6b; text-shadow: 3px 3px 0 #ffb6e6;
             letter-spacing: 0.5px; margin-bottom: 6px; text-align: center;
             display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .subhead { background: #fff0f9; padding: 6px 16px; border-radius: 60px;
            box-shadow: 0 4px 0 #d9b0d0; color: #5e2e5e; font-weight: 600;
            margin-bottom: 14px; font-size: 0.9rem; border: 2px solid #ffb3d9; text-align: center; }

        /* --- page navigation --- */
        .page-nav {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            margin-bottom: 18px; width: 100%; max-width: 1100px;
        }
        .nav-btn {
            background: #ffffffd9; border: 2px solid #e2c7ff; border-radius: 40px;
            padding: 8px 16px; font-size: 0.85rem; font-weight: 700; color: #4a2c6b;
            cursor: pointer; transition: all 0.12s; box-shadow: 0 4px 0 #c9b0e0;
            display: flex; align-items: center; gap: 4px;
        }
        .nav-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9b0e0; }
        .nav-btn.active { background: #ffe485; border-color: #ffd84d;
            box-shadow: 0 4px 0 #c9a227; color: #7a5c00; }
        .nav-btn.bank-btn { background: #d4f0ff; border-color: #8ad4ff;
            box-shadow: 0 4px 0 #6ab5e0; color: #0a4a6b; }
        .nav-btn.bank-btn.active { background: #8ad4ff; color: #003a55; }

        /* --- page content --- */
        .page-content {
            width: 100%; max-width: 1100px;
            display: flex; flex-direction: column; align-items: center;
        }
        .page { display: none; width: 100%; animation: fadeIn 0.2s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* --- day page --- */
        .day-title {
            font-size: 1.8rem; font-weight: 800; text-align: center; color: #3d2a5c;
            margin-bottom: 4px; text-shadow: 2px 2px 0 #ffcdff;
        }
        .day-progress {
            text-align: center; font-size: 0.95rem; font-weight: 700;
            color: #7a5c9e; margin-bottom: 14px; letter-spacing: 0.5px;
        }
        .day-progress.complete { color: #c9a227; }

        /* --- subject blocks --- */
        .subject-block {
            background: #fffffffa; border-radius: 24px; padding: 12px 12px 14px;
            margin-bottom: 12px; box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 4px 14px rgba(147,112,219,0.15);
            border: 2px solid #fff;
        }
        .subject-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-bottom: 10px; padding-bottom: 8px;
            border-bottom: 2px dashed #e2c7ff;
        }
        .subject-name-input {
            font-size: 1.15rem; font-weight: 800; color: #3d2a5c;
            border: none; background: #f9f3ff; border-radius: 12px;
            padding: 6px 10px; flex: 1; min-width: 100px;
            border: 2px solid transparent; transition: 0.15s;
            font-family: inherit;
        }
        .subject-name-input:focus { outline: none; border-color: #bf8cff; background: #fff; }
        .subject-name-input::placeholder { color: #b29bc9; font-weight: 600; }

        .icon-btn {
            background: #ffd6e7; border: none; border-radius: 50%;
            width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 0 #d99cb8; transition: all 0.08s;
            border: 2px solid white; flex-shrink: 0; padding: 0; line-height: 1;
        }
        .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d99cb8; }
        .icon-btn.remove-btn { background: #ffc7c7; box-shadow: 0 3px 0 #d98a8a; color: #7a1a1a; }
        .icon-btn.add-btn { background: #c1f0c1; box-shadow: 0 3px 0 #7d9e7d; color: #1a5c1a; }

        /* --- task list inside subject --- */
        .task-list { display: flex; flex-direction: column; gap: 6px; }
        .task-item {
            display: flex; align-items: center; gap: 8px;
            background: #f9f3ff; border-radius: 40px; padding: 5px 6px 5px 12px;
            border: 1.5px solid #f0e6ff;
        }
        .task-text {
            flex: 1; font-size: 0.88rem; font-weight: 500; color: #2e1a4a;
            border: none; background: transparent; padding: 4px 2px;
            font-family: inherit; min-width: 0;
        }
        .task-text:focus { outline: none; background: #fff; border-radius: 8px; padding: 4px 6px; }
        .task-text::placeholder { color: #b29bc9; font-size: 0.8rem; }

        .task-check {
            background: #e4e4e4; border: none; border-radius: 50%;
            width: 30px; height: 30px; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 0 #aaa; transition: all 0.08s;
            border: 2px solid white; flex-shrink: 0; padding: 0; line-height: 1;
            color: #666;
        }
        .task-check:active { transform: translateY(1px); box-shadow: 0 1px 0 #aaa; }
        .task-check.done { background: #ffe485; box-shadow: 0 2px 0 #c9a227; color: #7a5c00; }

        .task-remove {
            background: transparent; border: none; color: #d98a8a;
            font-size: 1.1rem; cursor: pointer; width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; flex-shrink: 0; padding: 0; line-height: 1;
        }
        .task-remove:active { background: #ffd6e7; }

        .add-task-btn {
            background: #e8f8e8; border: 2px dashed #9ad49a; border-radius: 40px;
            padding: 6px 12px; font-size: 0.82rem; font-weight: 700;
            color: #2a5c2a; cursor: pointer; margin-top: 8px;
            display: inline-flex; align-items: center; gap: 4px;
            font-family: inherit; transition: 0.12s;
        }
        .add-task-btn:active { background: #d4f0d4; }

        .empty-hint {
            font-size: 0.8rem; color: #b29bc9; font-style: italic;
            padding: 6px 4px; text-align: center;
        }

        /* --- add subject button --- */
        .add-subject-btn {
            background: #fff7e0; border: 3px dashed #ffd84d; border-radius: 24px;
            padding: 14px; font-size: 1rem; font-weight: 800;
            color: #8a6d00; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-family: inherit; transition: 0.12s; margin-top: 4px;
        }
        .add-subject-btn:active { background: #ffefb0; }

        /* --- task bank page --- */
        .bank-title {
            font-size: 1.6rem; font-weight: 800; text-align: center; color: #0a4a6b;
            margin-bottom: 4px; text-shadow: 2px 2px 0 #b3e4ff;
        }
        .bank-sub { text-align: center; font-size: 0.9rem; color: #4a6b7a;
            margin-bottom: 14px; font-weight: 600; }
        .bank-list { display: flex; flex-direction: column; gap: 8px; }
        .bank-item {
            display: flex; align-items: center; gap: 8px;
            background: #fffffffa; border-radius: 16px; padding: 8px 10px;
            border: 2px solid #d4f0ff; box-shadow: 0 3px 0 #b3e4ff;
        }
        .bank-item .task-text { font-size: 0.95rem; }
        .bank-add-row {
            display: flex; gap: 8px; margin-top: 14px;
            background: #fffffffa; border-radius: 16px; padding: 8px;
            border: 2px solid #8ad4ff; box-shadow: 0 3px 0 #6ab5e0;
        }
        .bank-add-row input {
            flex: 1; border: 2px solid #d4f0ff; border-radius: 12px;
            padding: 8px 12px; font-size: 0.95rem; font-family: inherit;
            background: #f9fdff;
        }
        .bank-add-row input:focus { outline: none; border-color: #6ab5e0; background: #fff; }
        .bank-add-row button {
            background: #8ad4ff; border: none; border-radius: 12px;
            padding: 8px 16px; font-weight: 800; font-size: 0.9rem;
            color: #003a55; cursor: pointer; box-shadow: 0 3px 0 #6ab5e0;
            font-family: inherit; flex-shrink: 0;
        }
        .bank-add-row button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6ab5e0; }

        /* --- celebration overlays --- */
        .celebration-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
            z-index: 9999; visibility: hidden; }
        .celebration-overlay.active { visibility: visible; animation: popFade 1.8s ease forwards; }
        .confetti-burst { font-size: 5rem; text-shadow: 0 0 20px gold;
            animation: floatUp 1.6s ease-out;
            background: radial-gradient(circle, #fff7b0, transparent 70%);
            padding: 40px; border-radius: 50%; display: flex; gap: 20px;
            flex-wrap: wrap; justify-content: center; align-items: center; color: #ff4d6d; }
        @keyframes popFade {
            0% { opacity: 0; transform: scale(0.7); }
            20% { opacity: 1; transform: scale(1.1); }
            40% { transform: scale(1); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        @keyframes floatUp {
            0% { transform: translateY(30px) rotate(-5deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-10px) rotate(5deg); }
            60% { transform: translateY(-30px) rotate(-3deg); }
            100% { transform: translateY(-80px) rotate(10deg); opacity: 0; }
        }

        .full-day-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,215,80,0.92), rgba(255,150,200,0.9));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; visibility: hidden; pointer-events: none; text-align: center; padding: 20px;
        }
        .full-day-overlay.active { visibility: visible; animation: fullDayAnim 3s ease forwards; }
        @keyframes fullDayAnim {
            0% { opacity: 0; transform: scale(0.6); }
            15% { opacity: 1; transform: scale(1.05); }
            25% { transform: scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.1); }
        }
        .full-day-overlay .big-emoji { font-size: 6rem; animation: bounceBig 0.7s ease infinite alternate; }
        @keyframes bounceBig {
            from { transform: translateY(0) rotate(-5deg); }
            to { transform: translateY(-18px) rotate(5deg); }
        }
        .full-day-overlay .msg { font-size: 2.2rem; font-weight: 900; color: #fff;
            text-shadow: 3px 3px 0 #b34d00, 0 0 20px #fff; margin: 12px 0; letter-spacing: 1px; }
        .full-day-overlay .sub-msg { font-size: 1.15rem; font-weight: 700; color: #5e2e5e;
            background: #fff8d9; padding: 8px 22px; border-radius: 40px; box-shadow: 0 5px 0 #c9a227; }

        .toast-sound-hint { position: fixed; bottom: 12px; right: 12px; background: #ffe0b0;
            border-radius: 40px; padding: 6px 14px; font-size: 0.75rem; color: #6b4a1f;
            border: 2px solid #ffb882; box-shadow: 0 3px 0 #b87c3a; opacity: 0.85;
            pointer-events: none; z-index: 1000; font-weight: 600; }

        .footer-note { margin-top: 18px; font-size: 0.85rem; color: #4f3a6b; background: #ffe9fc;
            padding: 6px 20px; border-radius: 40px; border: 2px solid #ffb3e0; text-align: center; }

        @media (max-width: 500px) {
            .day-title { font-size: 1.5rem; }
            .subject-name-input { font-size: 1rem; }
            .nav-btn { padding: 6px 12px; font-size: 0.78rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <h1><span>📋✨</span> My Weekly To-Do <span>🌈🎀</span></h1>
    <div class="subhead">⭐ Add subjects · build task lists · celebrate when done ⭐</div>

    <!-- Page navigation -->
    <div class="page-nav" id="pageNav"></div>

    <!-- Page content -->
    <div class="page-content" id="pageContent"></div>

    <div class="footer-note">
        💖 Each day has its own page · tasks come from your Task Bank 💖
    </div>

    <!-- Celebration overlays -->
    <div class="celebration-overlay" id="celebration">
        <div class="confetti-burst" id="confettiBurst">🎉🎊🥳✨🎈</div>
    </div>
    <div class="full-day-overlay" id="fullDayOverlay">
        <div class="big-emoji" id="fullDayEmoji">🏆</div>
        <div class="msg" id="fullDayMsg">PERFECT DAY!</div>
        <div class="sub-msg" id="fullDaySubMsg">You did all your tasks! Amazing!</div>
    </div>

    <div class="toast-sound-hint">🔊 sound on</div>

    <script>
        (function(){
            const DAYS = [
                { name: 'Monday', emoji: '🌸' }, { name: 'Tuesday', emoji: '🌼' },
                { name: 'Wednesday', emoji: '🌻' }, { name: 'Thursday', emoji: '🍀' },
                { name: 'Friday', emoji: '⭐' }, { name: 'Saturday', emoji: '🌈' },
                { name: 'Sunday', emoji: '🦄' }
            ];

            // ============================================================
            // DATA MODEL
            // ============================================================
            // taskBank: array of { id, text }
            // days: array of 7 days, each day = array of subjects
            //   subject = { id, name, tasks: [ { id, text, done } ] }
            // ============================================================

            let taskBank = [];       // { id, text }
            let days = [];           // [ [subject,...], ... ] length 7
            let nextId = 1;

            function genId() { return 'id_' + (nextId++) + '_' + Date.now(); }

            function initEmptyData() {
                taskBank = [];
                days = Array(7).fill().map(() => []);
                nextId = 1;
            }

            // ============================================================
            // STORAGE
            // ============================================================
            const STORAGE_KEY = 'weeklyTodo_v3_12yo';

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ taskBank, days, nextId }));
                } catch (e) {}
            }

            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    if (data && Array.isArray(data.taskBank) && Array.isArray(data.days) && data.days.length === 7) {
                        taskBank = data.taskBank;
                        days = data.days;
                        nextId = data.nextId || 1;
                        // basic integrity
                        for (let d = 0; d < 7; d++) {
                            if (!Array.isArray(days[d])) days[d] = [];
                        }
                    }
                } catch (e) {}
            }

            // ============================================================
            // SOUNDS
            // ============================================================
            function playBeep(freq = 880, duration = 0.1, type = 'sine', vol = 0.15) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type; osc.frequency.value = freq;
                    gain.gain.value = vol;
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {}
            }

            function playCelebrationSound() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const osc = ctx.createOscillator(); const g = ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.value = freq;
                        g.gain.setValueAtTime(0.12, now + i * 0.09);
                        g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.4);
                        osc.connect(g); g.connect(ctx.destination);
                        osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.4);
                    });
                } catch (e) {}
            }

            function playFanfare() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    const melody = [
                        [523.25, 0], [523.25, 0.15], [523.25, 0.30], [659.25, 0.45],
                        [783.99, 0.60], [1046.50, 0.85], [1046.50, 1.05], [1318.51, 1.20]
                    ];
                    melody.forEach(([freq, t]) => {
                        const osc = ctx.createOscillator(); const g = ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.value = freq;
                        g.gain.setValueAtTime(0.14, now + t);
                        g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.5);
                        osc.connect(g); g.connect(ctx.destination);
                        osc.start(now + t); osc.stop(now + t + 0.5);
                    });
                } catch (e) {}
            }

            // ============================================================
            // CELEBRATIONS
            // ============================================================
            const celebrationOverlay = document.getElementById('celebration');
            const confettiBurst = document.getElementById('confettiBurst');
            const fullDayOverlay = document.getElementById('fullDayOverlay');
            const fullDayEmoji = document.getElementById('fullDayEmoji');
            const fullDayMsg = document.getElementById('fullDayMsg');
            const fullDaySubMsg = document.getElementById('fullDaySubMsg');

            function celebrate() {
                playCelebrationSound();
                const emojis = ['🎉','🎊','🥳','✨','🎈','🌟','💖','⭐','🌈','🍭','🦄','🌸'];
                let html = '';
                for (let i = 0; i < 12; i++) html += emojis[Math.floor(Math.random() * emojis.length)];
                confettiBurst.textContent = html;
                celebrationOverlay.classList.remove('active');
                void celebrationOverlay.offsetWidth;
                celebrationOverlay.classList.add('active');
                playBeep(1200, 0.08, 'sine');
                setTimeout(() => celebrationOverlay.classList.remove('active'), 1800);
            }

            const fullDayRewards = [
                { emoji: '🏆', msg: 'PERFECT DAY!', sub: 'You did all your tasks! Amazing!' },
                { emoji: '🌟', msg: 'SUPERSTAR!', sub: 'Every single task done!' },
                { emoji: '🎉', msg: 'FULL HOUSE!', sub: 'You crushed it today!' },
                { emoji: '🦄', msg: 'UNICORN DAY!', sub: 'Magical effort — all done!' },
                { emoji: '👑', msg: 'QUEEN OF TODAY!', sub: 'All tasks complete — wow!' }
            ];

            function celebrateFullDay() {
                playFanfare();
                const r = fullDayRewards[Math.floor(Math.random() * fullDayRewards.length)];
                fullDayEmoji.textContent = r.emoji;
                fullDayMsg.textContent = r.msg;
                fullDaySubMsg.textContent = r.sub;
                fullDayOverlay.classList.remove('active');
                void fullDayOverlay.offsetWidth;
                fullDayOverlay.classList.add('active');
                setTimeout(() => fullDayOverlay.classList.remove('active'), 3200);
            }

            // ============================================================
            // UI STATE
            // ============================================================
            let currentPage = 'day0';   // 'day0' ... 'day6' or 'bank'

            // ============================================================
            // RENDER: NAV
            // ============================================================
            const pageNav = document.getElementById('pageNav');
            const pageContent = document.getElementById('pageContent');

            function renderNav() {
                pageNav.innerHTML = '';
                DAYS.forEach((day, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'nav-btn' + (currentPage === 'day' + idx ? ' active' : '');
                    btn.innerHTML = `${day.emoji} ${day.name}`;
                    btn.addEventListener('click', () => goToPage('day' + idx));
                    pageNav.appendChild(btn);
                });
                const bankBtn = document.createElement('button');
                bankBtn.className = 'nav-btn bank-btn' + (currentPage === 'bank' ? ' active' : '');
                bankBtn.innerHTML = '📚 Task Bank';
                bankBtn.addEventListener('click', () => goToPage('bank'));
                pageNav.appendChild(bankBtn);
            }

            function goToPage(pageId) {
                currentPage = pageId;
                renderNav();
                renderPage();
                playBeep(600, 0.05, 'sine', 0.08);
            }

            // ============================================================
            // RENDER: PAGE
            // ============================================================
            function renderPage() {
                pageContent.innerHTML = '';
                if (currentPage === 'bank') {
                    pageContent.appendChild(renderBankPage());
                } else {
                    const dayIdx = parseInt(currentPage.replace('day', ''));
                    pageContent.appendChild(renderDayPage(dayIdx));
                }
            }

            // ============================================================
            // RENDER: DAY PAGE
            // ============================================================
            function renderDayPage(dayIdx) {
                const wrap = document.createElement('div');
                wrap.className = 'page active';
                const day = DAYS[dayIdx];

                // title
                const title = document.createElement('div');
                title.className = 'day-title';
                title.textContent = `${day.emoji} ${day.name}`;
                wrap.appendChild(title);

                // progress
                const prog = document.createElement('div');
                prog.className = 'day-progress';
                prog.id = 'day-progress-' + dayIdx;
                wrap.appendChild(prog);

                // subject blocks
                days[dayIdx].forEach((subject, subjIdx) => {
                    wrap.appendChild(renderSubjectBlock(dayIdx, subjIdx, subject));
                });

                // add subject button
                const addSubjBtn = document.createElement('button');
                addSubjBtn.className = 'add-subject-btn';
                addSubjBtn.innerHTML = '➕ Add Subject';
                addSubjBtn.addEventListener('click', () => {
                    days[dayIdx].push({
                        id: genId(),
                        name: '',
                        tasks: []
                    });
                    saveToStorage();
                    renderPage();
                    playBeep(700, 0.08, 'sine');
                });
                wrap.appendChild(addSubjBtn);

                // update progress
                setTimeout(() => updateDayProgress(dayIdx), 0);

                return wrap;
            }

            function renderSubjectBlock(dayIdx, subjIdx, subject) {
                const block = document.createElement('div');
                block.className = 'subject-block';

                // header
                const header = document.createElement('div');
                header.className = 'subject-header';

                const nameInput = document.createElement('input');
                nameInput.className = 'subject-name-input';
                nameInput.type = 'text';
                nameInput.placeholder = 'Subject name';
                nameInput.value = subject.name || '';
                nameInput.addEventListener('input', (e) => {
                    subject.name = e.target.value;
                    saveToStorage();
                });
                nameInput.addEventListener('blur', () => saveToStorage());
                header.appendChild(nameInput);

                const removeSubjBtn = document.createElement('button');
                removeSubjBtn.className = 'icon-btn remove-btn';
                removeSubjBtn.textContent = '✕';
                removeSubjBtn.title = 'Remove subject';
                removeSubjBtn.addEventListener('click', () => {
                    if (confirm(`Remove "${subject.name || 'this subject'}" and all its tasks?`)) {
                        days[dayIdx].splice(subjIdx, 1);
                        saveToStorage();
                        renderPage();
                        playBeep(500, 0.1, 'sawtooth');
                    }
                });
                header.appendChild(removeSubjBtn);

                block.appendChild(header);

                // task list
                const taskList = document.createElement('div');
                taskList.className = 'task-list';

                if (subject.tasks.length === 0) {
                    const hint = document.createElement('div');
                    hint.className = 'empty-hint';
                    hint.textContent = 'No tasks yet — add some below!';
                    taskList.appendChild(hint);
                } else {
                    subject.tasks.forEach((task, taskIdx) => {
                        taskList.appendChild(renderTaskItem(dayIdx, subjIdx, taskIdx, task));
                    });
                }
                block.appendChild(taskList);

                // add task button (opens bank picker)
                const addTaskBtn = document.createElement('button');
                addTaskBtn.className = 'add-task-btn';
                addTaskBtn.innerHTML = '➕ Add task from Bank';
                addTaskBtn.addEventListener('click', () => openBankPicker(dayIdx, subjIdx));
                block.appendChild(addTaskBtn);

                return block;
            }

            function renderTaskItem(dayIdx, subjIdx, taskIdx, task) {
                const item = document.createElement('div');
                item.className = 'task-item';

                const text = document.createElement('input');
                text.className = 'task-text';
                text.type = 'text';
                text.value = task.text || '';
                text.addEventListener('input', (e) => {
                    task.text = e.target.value;
                    saveToStorage();
                });
                text.addEventListener('blur', () => saveToStorage());
                item.appendChild(text);

                const checkBtn = document.createElement('button');
                checkBtn.className = 'task-check' + (task.done ? ' done' : '');
                checkBtn.textContent = task.done ? '✅' : '○';
                checkBtn.addEventListener('click', () => {
                    task.done = !task.done;
                    saveToStorage();
                    if (task.done) {
                        playBeep(880, 0.1, 'sine');
                        celebrate();
                    } else {
                        playBeep(400, 0.1, 'sine');
                    }
                    renderPage(); // re-render to update styling
                });
                item.appendChild(checkBtn);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'task-remove';
                removeBtn.textContent = '✕';
                removeBtn.title = 'Remove task';
                removeBtn.addEventListener('click', () => {
                    subject.tasks.splice(taskIdx, 1);
                    saveToStorage();
                    renderPage();
                    playBeep(500, 0.08, 'sawtooth');
                });
                item.appendChild(removeBtn);

                return item;
            }

            function updateDayProgress(dayIdx) {
                const prog = document.getElementById('day-progress-' + dayIdx);
                if (!prog) return;
                let total = 0, done = 0;
                days[dayIdx].forEach(subj => {
                    subj.tasks.forEach(t => {
                        total++;
                        if (t.done) done++;
                    });
                });
                if (total === 0) {
                    prog.textContent = 'No tasks yet';
                    prog.classList.remove('complete');
                    return;
                }
                prog.textContent = `${done}/${total} tasks done`;
                if (done === total && total > 0) {
                    prog.classList.add('complete');
                    prog.textContent = `🏆 ${done}/${total} COMPLETE!`;
                    celebrateFullDay();
                } else {
                    prog.classList.remove('complete');
                }
            }

            // ============================================================
            // RENDER: BANK PAGE
            // ============================================================
            function renderBankPage() {
                const wrap = document.createElement('div');
                wrap.className = 'page active';

                const title = document.createElement('div');
                title.className = 'bank-title';
                title.textContent = '📚 Task Bank';
                wrap.appendChild(title);

                const sub = document.createElement('div');
                sub.className = 'bank-sub';
                sub.textContent = 'All tasks live here. Add, edit, or remove them.';
                wrap.appendChild(sub);

                const list = document.createElement('div');
                list.className = 'bank-list';

                if (taskBank.length === 0) {
                    const hint = document.createElement('div');
                    hint.className = 'empty-hint';
                    hint.textContent = 'Bank is empty — add your first task below!';
                    list.appendChild(hint);
                } else {
                    taskBank.forEach((task, idx) => {
                        const item = document.createElement('div');
                        item.className = 'bank-item';

                        const text = document.createElement('input');
                        text.className = 'task-text';
                        text.type = 'text';
                        text.value = task.text;
                        text.addEventListener('input', (e) => {
                            task.text = e.target.value;
                            saveToStorage();
                        });
                        text.addEventListener('blur', () => saveToStorage());
                        item.appendChild(text);

                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'task-remove';
                        removeBtn.textContent = '✕';
                        removeBtn.title = 'Remove from bank';
                        removeBtn.addEventListener('click', () => {
                            taskBank.splice(idx, 1);
                            saveToStorage();
                            renderPage();
                            playBeep(500, 0.08, 'sawtooth');
                        });
                        item.appendChild(removeBtn);

                        list.appendChild(item);
                    });
                }
                wrap.appendChild(list);

                // add new task row
                const addRow = document.createElement('div');
                addRow.className = 'bank-add-row';

                const newInput = document.createElement('input');
                newInput.type = 'text';
                newInput.placeholder = 'New task to add to bank...';
                addRow.appendChild(newInput);

                const addBtn = document.createElement('button');
                addBtn.textContent = 'Add';
                addBtn.addEventListener('click', () => {
                    const val = newInput.value.trim();
                    if (!val) return;
                    taskBank.push({ id: genId(), text: val });
                    saveToStorage();
                    renderPage();
                    playBeep(800, 0.08, 'sine');
                });
                addRow.appendChild(addBtn);

                newInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') addBtn.click();
                });

                wrap.appendChild(addRow);
                return wrap;
            }

            // ============================================================
            // BANK PICKER (modal)
            // ============================================================
            function openBankPicker(dayIdx, subjIdx) {
                // simple prompt-based picker would be ugly; let's make a modal
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed; inset: 0; background: rgba(40,20,60,0.5);
                    display: flex; align-items: center; justify-content: center;
                    z-index: 10001; padding: 16px;
                `;
                const box = document.createElement('div');
                box.style.cssText = `
                    background: #fff; border-radius: 24px; padding: 16px;
                    max-width: 420px; width: 100%; max-height: 80vh; overflow-y: auto;
                    box-shadow: 0 12px 0 rgba(0,0,0,0.15);
                `;

                const heading = document.createElement('div');
                heading.style.cssText = 'font-weight: 800; font-size: 1.2rem; color: #3d2a5c; margin-bottom: 10px; text-align: center;';
                heading.textContent = '📚 Pick a task from the Bank';
                box.appendChild(heading);

                if (taskBank.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.cssText = 'text-align: center; color: #b29bc9; padding: 20px; font-style: italic;';
                    empty.textContent = 'Bank is empty. Go to 📚 Task Bank to add tasks first.';
                    box.appendChild(empty);
                } else {
                    taskBank.forEach(task => {
                        const btn = document.createElement('button');
                        btn.style.cssText = `
                            display: block; width: 100%; text-align: left; background: #f9f3ff;
                            border: 2px solid #e2c7ff; border-radius: 12px; padding: 10px 14px;
                            font-size: 0.95rem; font-family: inherit; color: #2e1a4a;
                            cursor: pointer; margin-bottom: 6px;
                        `;
                        btn.textContent = task.text;
                        btn.addEventListener('click', () => {
                            days[dayIdx][subjIdx].tasks.push({
                                id: genId(),
                                text: task.text,
                                done: false
                            });
                            saveToStorage();
                            document.body.removeChild(overlay);
                            renderPage();
                            playBeep(900, 0.08, 'sine');
                        });
                        box.appendChild(btn);
                    });
                }

                const cancelBtn = document.createElement('button');
                cancelBtn.style.cssText = `
                    display: block; width: 100%; background: #ffd6e7; border: none;
                    border-radius: 40px; padding: 10px; font-weight: 800;
                    font-size: 0.95rem; color: #7a1a4a; cursor: pointer;
                    margin-top: 8px; font-family: inherit;
                `;
                cancelBtn.textContent = 'Cancel';
                cancelBtn.addEventListener('click', () => {
                    document.body.removeChild(overlay);
                });
                box.appendChild(cancelBtn);

                overlay.appendChild(box);
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) document.body.removeChild(overlay);
                });
                document.body.appendChild(overlay);
            }

            // ============================================================
            // INIT
            // ============================================================
            loadFromStorage();

            // If completely empty (first run), add a few default subjects to Monday as example
            if (days.every(d => d.length === 0)) {
                // leave empty — she can add subjects herself
            }

            renderNav();
            renderPage();

            window.addEventListener('beforeunload', saveToStorage);

            // unlock audio
            let welcomed = false;
            document.body.addEventListener('click', function() {
                if (!welcomed) { playBeep(660, 0.08, 'sine'); welcomed = true; }
            }, { once: false });

        })();
    </script>
</body>
</html>
